name: Ajustar abas Mercado Livre e Shopee

on:
  push:
    paths:
      - '.github/workflows/ajustar-abas-ofertas.yml'

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Ajustar barra inferior
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text(encoding='utf-8')

          old_menu = '''  const menu = [
    ["inicio", "Inicio"],
    ["ofertas", "Ofertas"],
    ["conteudo", "Conteudo"],
    ["resultados", "Resultados"],
    ["config", "Config"]
  ];'''

          new_menu = '''  const menu = [
    ["inicio", "Inicio", "inicio", ""],
    ["ofertas-ml", "Mercado Livre", "ofertas", "mercadolivre"],
    ["ofertas-shopee", "Shopee", "ofertas", "shopee"],
    ["conteudo", "Conteudo", "conteudo", ""],
    ["resultados", "Resultados", "resultados", ""],
    ["config", "Config", "config", ""]
  ];'''

          old_nav = '''      <nav>
        {menu.map(([id, nome]) => <button key={id} className={pagina === id ? "ativo" : ""} onClick={() => setPagina(id)}><span>{id === "inicio" && "🏠"}{id === "ofertas" && "🔎"}{id === "conteudo" && "🎬"}{id === "resultados" && "📊"}{id === "config" && "⚙️"}</span><small>{nome}</small></button>)}
      </nav>'''

          new_nav = '''      <nav>
        {menu.map(([id, nome, destino, aba]) => (
          <button
            key={id}
            className={pagina === destino && (!aba || abaOfertas === aba) ? "ativo" : ""}
            onClick={() => {
              setPagina(destino);
              if (aba) {
                setAbaOfertas(aba);
                setMensagemOferta("");
              }
            }}
          >
            <span>{destino === "inicio" && "🏠"}{aba === "mercadolivre" && "🛒"}{aba === "shopee" && "🟠"}{destino === "conteudo" && "🎬"}{destino === "resultados" && "📊"}{destino === "config" && "⚙️"}</span>
            <small>{nome}</small>
          </button>
        ))}
      </nav>'''

          if old_menu not in s:
              raise SystemExit('menu esperado nao encontrado')
          if old_nav not in s:
              raise SystemExit('nav esperado nao encontrado')

          s = s.replace(old_menu, new_menu, 1)
          s = s.replace(old_nav, new_nav, 1)
          s = s.replace('const FRONTEND_BUILD_VERSION = "2026-10-01-ofertas-abas";', 'const FRONTEND_BUILD_VERSION = "2026-10-01-ofertas-ml-shopee-bottom";', 1)
          p.write_text(s, encoding='utf-8')

      - name: Gravar alteracao e remover workflow temporario
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git rm .github/workflows/ajustar-abas-ofertas.yml
          git commit -m "Separar Mercado Livre e Shopee na barra inferior"
          git push
