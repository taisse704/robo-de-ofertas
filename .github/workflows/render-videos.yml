name: Renderizar videos do Robô de Ofertas

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/render-videos.yml"
      - "scripts/render-videos.mjs"

concurrency:
  group: robo-render-videos
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: https://ytymdncyaynmypiodhfc.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar e verificar FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Verificar fonte de vídeo
        run: |
          test -f scripts/render-videos.mjs
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf

      # Teste de renderização automática\n      - name: Renderizar pendentes
        run: node scripts/render-videos.mjs
