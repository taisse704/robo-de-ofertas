name: Deploy ROBÔ DE OFERTAS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: robo-de-ofertas-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Ajustar navegação de ofertas
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/App.jsx')
          s = p.read_text(encoding='utf-8')

          # Remove a antiga seleção de Mercado Livre/Shopee do topo.
          s, removidos = re.subn(
              r'\n\s*<div className="panel" style=\{\{ display: "flex", gap: "8px", flexWrap: "wrap" \}\}>\s*'
              r'<button className=\{abaOfertas === "mercadolivre" \? "primary" : "secondary"\}[\s\S]*?'
              r'<button className=\{abaOfertas === "shopee" \? "primary" : "secondary"\}[\s\S]*?</div>\s*',
              '\n',
              s,
              count=1
          )

          new_menu = '''  const menu = [
    ["inicio", "Inicio", "inicio", ""],
    ["ofertas-ml", "Mercado Livre", "ofertas", "mercadolivre"],
    ["ofertas-shopee", "Shopee", "ofertas", "shopee"],
    ["conteudo", "Conteudo", "conteudo", ""],
    ["resultados", "Resultados", "resultados", ""],
    ["config", "Config", "config", ""]
  ];'''

          s, menus = re.subn(
              r'  const menu = \[[\s\S]*?\n  \];',
              new_menu,
              s,
              count=1
          )

          new_nav = '''      <nav>
        {menu.map(([id, nome, destino, aba]) => (
          <button
            key={id}
            className={pagina === destino && (!aba || abaOfertas === aba) ? "ativo" : ""}
            onClick={() => {
              setPagina(destino);
              if (aba) {
                setAbaOfertas(aba);
                setMensagemOferta("");
              }
            }}
          >
            <span>{destino === "inicio" && "🏠"}{aba === "mercadolivre" && "🛒"}{aba === "shopee" && "🟠"}{destino === "conteudo" && "🎬"}{destino === "resultados" && "📊"}{destino === "config" && "⚙️"}</span>
            <small>{nome}</small>
          </button>
        ))}
      </nav>'''

          s, navs = re.subn(
              r'      <nav>\s*\{menu\.map\(\(\[id, nome\]\) =>[\s\S]*?</nav>',
              new_nav,
              s,
              count=1
          )

          s = s.replace(
              'const FRONTEND_BUILD_VERSION = "2026-10-01-ofertas-abas";',
              'const FRONTEND_BUILD_VERSION = "2026-10-01-ofertas-ml-shopee-bottom";',
              1
          )

          if menus != 1 or navs != 1:
              raise SystemExit(f'Falha no ajuste da navegacao: menu={menus}, nav={navs}, topo_removido={removidos}')

          p.write_text(s, encoding='utf-8')
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar dependências
        run: npm install
      - name: Criar aplicação
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Publicar site
        uses: actions/deploy-pages@v4

  deploy-functions:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ytymdncyaynmypiodhfc
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Publicar process-offers
        run: supabase functions deploy process-offers --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
      - name: Publicar generate-content
        run: supabase functions deploy generate-content --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
      - name: Publicar publish-content
        run: supabase functions deploy publish-content --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
      - name: Publicar robot-worker
        run: supabase functions deploy robot-worker --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
