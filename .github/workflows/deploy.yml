name: Deploy ROBÔ DE OFERTAS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: robo-de-ofertas-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar dependências
        run: npm install
      - name: Criar aplicação
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Copiar arquivos públicos
        run: |
          cp termos-de-servico.html dist/termos-de-servico.html
          cp politica-de-privacidade.html dist/politica-de-privacidade.html
          cp tiktokKyy4LndrKYE3YNKZjWyOZ2uSDD3gHbdy.txt dist/tiktokKyy4LndrKYE3YNKZjWyOZ2uSDD3gHbdy.txt
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4

